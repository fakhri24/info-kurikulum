name: Sinkronkan tautan dari Google Sheet

on:
  schedule:
    # 15.00 UTC = 22.00 WIB, setiap hari
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-links
  cancel-in-progress: false

jobs:
  sinkronkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil CSV dan tulis data/links.json
        run: python3 scripts/sync_links.py

      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet -- data/links.json; then
            echo "Tidak ada perubahan pada data/links.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links.json
          git commit -m "chore: segarkan data/links.json dari Google Sheet"
          git push
